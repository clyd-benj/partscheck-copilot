<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Clipboard Inspector</title>
<link rel="stylesheet" href="inspector.css" />
</head>
<body>
<div class="app">
  <h1>Clipboard Inspector</h1>
  <p class="hint">
    Copy something from ASA CAPS, then paste it below (Ctrl/Cmd+V) to see exactly
    what the extension detects. Nothing here is saved to the catalogue automatically.
  </p>

  <textarea id="rawInput" placeholder="Paste clipboard content here..." rows="8"></textarea>

  <div class="result">
    <div class="result-row">
      <span class="label">Classification</span>
      <span id="classification" class="value badge">—</span>
    </div>
    <div class="result-row">
      <span class="label">Detected VIN</span>
      <span id="detectedVin" class="value mono">—</span>
    </div>
    <div class="result-row">
      <span class="label">Detected Part Number</span>
      <span id="detectedPart" class="value mono">—</span>
    </div>
    <div class="result-row">
      <span class="label">Detected Description</span>
      <span id="detectedDesc" class="value">—</span>
    </div>
    <div class="result-row">
      <span class="label">Detected PNC</span>
      <span id="detectedPnc" class="value mono">—</span>
    </div>
  </div>

  <div class="save-row">
    <input id="fixtureName" type="text" placeholder="fixture-name.txt (for saving as a test fixture)" />
    <button id="btnSaveFixture" class="btn">Save Test Fixture</button>
  </div>
</div>
<script src="inspector.js"></script>
</body>
</html>
