<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ASA CAPS Catalogue</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>ASA CAPS CATALOGUE</h1>
    <label class="pause-toggle">
      <input type="checkbox" id="pauseToggle" />
      <span>Pause capture</span>
    </label>
  </header>

  <section class="active-vehicle" id="activeVehicleSection">
    <h2>ACTIVE VEHICLE</h2>
    <div id="activeVehicleEmpty" class="empty-state">
      No active vehicle yet. Copy vehicle details from ASA CAPS to begin.
    </div>
    <div id="activeVehicleContent" class="hidden">
      <div class="vehicle-title" id="vehicleTitle"></div>
      <div class="vehicle-vin" id="vehicleVin"></div>
      <div class="vehicle-meta">
        <span id="sessionStarted"></span>
        <span id="partCount"></span>
      </div>
    </div>
  </section>

  <section class="recent-parts">
    <h2>RECENT PARTS</h2>
    <ul id="recentPartsList" class="parts-list"></ul>
    <div id="recentPartsEmpty" class="empty-state">No parts captured yet.</div>
  </section>

  <section class="manual-controls">
    <button id="btnManualVehicle" class="btn">Set Vehicle Manually</button>
    <button id="btnCloseSession" class="btn">Close Current Vehicle</button>
    <button id="btnClearSession" class="btn">Clear Session</button>

    <div id="manualVehicleForm" class="manual-form hidden">
      <label for="manualVinInput">VIN</label>
      <input id="manualVinInput" type="text" maxlength="17" placeholder="17-character VIN" />
      <div class="manual-form-actions">
        <button id="btnManualVehicleConfirm" class="btn btn-primary">Set Active Vehicle</button>
        <button id="btnManualVehicleCancel" class="btn">Cancel</button>
      </div>
      <div id="manualVehicleError" class="error-text hidden"></div>
    </div>
  </section>

  <section class="actions">
    <button id="btnViewCatalogue" class="btn btn-primary">View Catalogue</button>
    <button id="btnExport" class="btn">Export Data</button>
  </section>

  <section class="debug-section">
    <label class="debug-toggle">
      <input type="checkbox" id="debugToggle" />
      <span>Debug mode</span>
    </label>
    <div id="debugPanel" class="debug-panel hidden">
      <h3>LAST CLIPBOARD EVENT</h3>
      <dl id="debugContent" class="debug-content"></dl>
      <button id="btnCopyDebug" class="btn">Copy Debug Information</button>
    </div>
    <label class="log-unknown-toggle">
      <input type="checkbox" id="logUnknownToggle" />
      <span>Log unknown clipboard events</span>
    </label>
    <a id="linkInspector" href="#" target="_blank">Open Clipboard Inspector</a>
  </section>

  <div id="toast" class="toast hidden"></div>
</div>
<script src="popup.js"></script>
</body>
</html>
